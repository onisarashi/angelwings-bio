<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>bukabtw</title>
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline>
        <source src="addons/video.mp4" type="video/mp4">
    </video>

    <div class="site">
        <div class="container">
            <img src="addons/photo.jpg" alt="Avatar" class="avatar">
            
            <div class="views" title="Views">
                <img src="addons/view.svg" alt="Views" class="view-icon"> 0
            </div>
            
            <div class="name"><span class="name-text">onisarashi</span></div>

            <div class="social-icons">
                <a href="https://discordapp.com/users/345868580006395906" class="icon-link" title="Discord">
                    <img src="addons/discord.svg" alt="Discord" class="social-icon">
                </a>
                <a href="https://steamcommunity.com/profiles/76561198970627071" class="icon-link" title="Steam">
                    <img src="addons/steam.svg" alt="Steam" class="social-icon">
                </a>
                <a href="https://t.me/onisarashi" class="icon-link" title="Telegram">
                    <img src="addons/telegram.svg" alt="Telegram" class="social-icon">
                </a>
            </div>
            <div class="location">
                <img src="addons/location.svg" alt="Location" class="location-icon"> under your bed
            </div>
            <div class="about">I'm just a little angel</div>

            <div class="custom-audio-player">
                <audio id="player" loop>
                    <source src="addons/Velial Squad, Meep - Slender.mp3" type="audio/mp3">
                </audio>
                
                <div class="player-header">
                    <img src="addons/photo.webp" alt="Track Cover" class="avatar-track">
                    
                    <div class="track-info">
                        <div class="name-track">VELIAL SQUAD, MEEP - SLENDER</div>
                        
                        <div class="player-controls">
                            <div class="play-pause">
                                <img class="play-button" src="addons/play.svg" alt="Play">
                                <img class="pause-button" src="addons/pause.svg" alt="Pause" style="display: none;">
                            </div>
                            
                            <div class="time-display">
                                <span class="current-time">0:00</span>
                                <div class="progress-container">
                                    <div class="progress-bar">
                                        <div class="progress-bar-fill"></div>
                                        <div class="progress-thumb"></div>
                                    </div>
                                </div>
                                <span class="duration">0:00</span>
                            </div>
                            
                            <div class="volume-control">
                                <img class="volume-icon" src="addons/volume-on.svg" alt="Volume">
                                <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="introOverlay">
        <div class="intro-content">いらっしゃいませ！</div>
        <div class="line-2"></div>
        <div class="line-3"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('player');
            const playButton = document.querySelector('.pause-button');
            const pauseButton = document.querySelector('.play-button');
            const progressBarFill = document.querySelector('.progress-bar-fill');
            const progressThumb = document.querySelector('.progress-thumb');
            const volumeIcon = document.querySelector('.volume-icon');
            const progressBar = document.querySelector('.progress-bar');
            const introOverlay = document.getElementById('introOverlay');
            const currentTimeEl = document.querySelector('.current-time');
            const durationEl = document.querySelector('.duration');
            const volumeSlider = document.querySelector('.volume-slider');
            
            function updateViewsCounter() {
                const viewsElement = document.querySelector('.views');
                if (!viewsElement) return;
                
                let views = localStorage.getItem('pageViews') || 0;
                views = parseInt(views) + 1;
                localStorage.setItem('pageViews', views);
                
                const viewIcon = viewsElement.querySelector('.view-icon');
                viewsElement.innerHTML = '';
                if (viewIcon) viewsElement.appendChild(viewIcon.cloneNode(true));
                viewsElement.appendChild(document.createTextNode(' ' + views));
            }
            
            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            
            function updateTime() {
                if (audio.duration && !isNaN(audio.duration)) {
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    durationEl.textContent = formatTime(audio.duration);
                } else {
                    if (audio.readyState >= 2) {
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                        durationEl.textContent = formatTime(audio.duration);
                    }
                }
            }
            
            function initAudio() {
                if (!audio) {
                    console.error('Аудио элемент не найден');
                    return;
                }
                
                console.log('Аудио элемент найден:', audio);
                
                audio.volume = 1;
                if (volumeSlider) volumeSlider.value = 1;
                
                audio.addEventListener('loadedmetadata', () => {
                    console.log('Метаданные загружены. Длительность:', audio.duration);
                    updateTime();
                });
                
                audio.addEventListener('canplay', () => {
                    console.log('Аудио готово к воспроизведению');
                    updateTime();
                });

                playButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    console.log('Play clicked');
                    
                    audio.play().then(() => {
                        console.log('Аудио запущено');
                        playButton.style.display = 'none';
                        pauseButton.style.display = 'block';
                    }).catch(error => {
                        console.error('Ошибка воспроизведения:', error);
                        playButton.style.display = 'block';
                        pauseButton.style.display = 'none';
                    });
                });
                
                pauseButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    console.log('Pause clicked');
                    audio.pause();
                    pauseButton.style.display = 'none';
                    playButton.style.display = 'block';
                });
                
                audio.addEventListener('timeupdate', () => {
                    if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
                        const progress = (audio.currentTime / audio.duration) * 100;
                        progressBarFill.style.width = `${progress}%`;
                        progressThumb.style.left = `${progress}%`;
                        updateTime();
                    }
                });
                
                if (progressBar) {
                    progressBar.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (!audio.duration || isNaN(audio.duration) || audio.duration <= 0) {
                            console.log('Длительность не доступна');
                            return;
                        }
                        
                        const rect = progressBar.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const width = rect.width;
                        const newTime = (clickX / width) * audio.duration;
                        
                        console.log('Клик по прогресс-бару:', {clickX, width, newTime, duration: audio.duration});
                        
                        audio.currentTime = newTime;
                        
                        const progress = (newTime / audio.duration) * 100;
                        progressBarFill.style.width = `${progress}%`;
                        progressThumb.style.left = `${progress}%`;
                        updateTime();
                    });
                }
                
                if (volumeSlider) {
                    volumeSlider.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        audio.volume = value;
                        volumeIcon.src = value > 0 ? 'addons/volume-on.svg' : 'addons/volume-off.svg';
                        console.log('Громкость изменена:', value);
                    });
                }
                
                volumeIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (audio.volume > 0) {
                        audio.volume = 0;
                        volumeIcon.src = 'addons/volume-off.svg';
                        if (volumeSlider) volumeSlider.value = 0;
                    } else {
                        audio.volume = 1;
                        volumeIcon.src = 'addons/volume-on.svg';
                        if (volumeSlider) volumeSlider.value = 1;
                    }
                    console.log('Громкость переключена:', audio.volume);
                });
                
                if (introOverlay) {
                    introOverlay.addEventListener('click', () => {
                        introOverlay.classList.add('fade-out');
                        
                        audio.play().then(() => {
                            console.log('Аудио запущено через интро');
                            playButton.style.display = 'none';
                            pauseButton.style.display = 'block';
                        }).catch(error => {
                            console.log('Автозапуск заблокирован. Пользователь должен кликнуть по кнопке play.');
                            playButton.style.display = 'block';
                            pauseButton.style.display = 'none';
                        });
                    });
                }
                
                setInterval(updateTime, 100);
            }

            function initTooltips() {
                const views = document.querySelector('.views');
                const iconLinks = document.querySelectorAll('.icon-link');
                
                if (views) {
                    let originalTitleViews = views.getAttribute('title');
                    views.addEventListener('mouseover', () => {
                        views.removeAttribute('title');
                        views.setAttribute('data-custom-title', originalTitleViews);
                    });
                    views.addEventListener('mouseout', () => {
                        views.setAttribute('title', originalTitleViews);
                        views.removeAttribute('data-custom-title');
                    });
                }
                
                iconLinks.forEach(link => {
                    let originalTitleLink = link.getAttribute('title');
                    if (originalTitleLink) {
                        link.addEventListener('mouseover', () => {
                            link.removeAttribute('title');
                            link.setAttribute('data-custom-title', originalTitleLink);
                        });
                        link.addEventListener('mouseout', () => {
                            link.setAttribute('title', originalTitleLink);
                            link.removeAttribute('data-custom-title');
                        });
                    }
                });
            }
            
            function init3DEffect() {
                const container = document.querySelector('.container');
                if (!container) return;
                
                console.log('Инициализация 3D эффекта');
                
                container.style.transformStyle = 'preserve-3d';
                container.style.transition = 'transform 0.2s ease-out';
                
                container.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateY = ((x - centerX) / centerX) * 10;
                    const rotateX = ((centerY - y) / centerY) * 10;
                    
                    container.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                });
                
                container.addEventListener('mouseleave', () => {
                    container.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
                });
            }

            const titleText = "bukabtw";
                let charIndex = 0;
                let isDeleting = false;

                function typewriterTitle() {
                    if (!isDeleting && charIndex <= titleText.length) {
                        document.title = titleText.substring(0, charIndex) + "|";
                        charIndex++;
                        setTimeout(typewriterTitle, 150);
                    } else if (isDeleting && charIndex >= 0) {
                        document.title = titleText.substring(0, charIndex) + "|";
                        charIndex--;
                        setTimeout(typewriterTitle, 100);
                    } else {
                        isDeleting = !isDeleting;
                        setTimeout(typewriterTitle, 1000);
                    }
                }

                typewriterTitle();
            
            console.log('Начинаем инициализацию...');
            updateViewsCounter();
            initAudio();
            initTooltips();
            init3DEffect();
            console.log('Инициализация завершена');
        });
    </script>
</body>
</html>
